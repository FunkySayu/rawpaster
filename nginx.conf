server {
    listen 80 default_server;
    server_name _;

    # Root for Angular static files
    root /app/static;
    index index.html index.htm;

    # Serve Angular app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Flask/Gunicorn backend
    location /api {
        proxy_pass http://127.0.0.1:8000; # Gunicorn will run on port 8000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Deny access to .htaccess files, if any are present
    location ~ /\.ht {
        deny all;
    }

    # Optional: Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html; # Default Nginx error page location
    }
}
